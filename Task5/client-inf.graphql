"""
Соответствует REST endpoint /clients/{id}
"""
type Client {
  id: ID!
  name: String
  age: Int
  documents: [Document] - гибкость в возможности получить в том числе и документы (у поля намеренно не ставим отметку обязательности)
  relatives: [Relative] - аналогично касаемо родственников (у поля намеренно не ставим отметку обязательности)
}

"""
Соответствует REST endpoint /clients/{id}/documents
"""
type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

"""
Соответствует REST endpoint /clients/{id}/relatives
"""
type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}
